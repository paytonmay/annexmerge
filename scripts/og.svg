<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4332"/>
      <stop offset="1" stop-color="#14301f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Corridor line with nodes, echoing the site map -->
  <path d="M 110 520 L 270 470 L 430 485 L 590 445 L 750 455 L 910 405 L 1090 330"
        fill="none" stroke="#2d6a4f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M 110 520 L 270 470 L 430 485 L 590 445 L 750 455 L 910 405 L 1090 330"
        fill="none" stroke="#95d5b2" stroke-width="4" stroke-dasharray="8 22" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="110" cy="520" r="26" fill="#d8f3dc"/>
  <circle cx="110" cy="520" r="38" fill="none" stroke="#e09f3e" stroke-width="4" opacity="0.9"/>
  <circle cx="270" cy="470" r="14" fill="#95d5b2"/>
  <circle cx="430" cy="485" r="10" fill="#74c69d" opacity="0.9"/>
  <circle cx="590" cy="445" r="10" fill="#74c69d" opacity="0.9"/>
  <circle cx="750" cy="455" r="10" fill="#74c69d" opacity="0.9"/>
  <circle cx="910" cy="405" r="13" fill="#95d5b2"/>
  <circle cx="1090" cy="330" r="22" fill="#d8f3dc"/>
  <circle cx="1090" cy="330" r="33" fill="none" stroke="#e09f3e" stroke-width="4" opacity="0.9"/>

  <!-- Faded branch stubs -->
  <path d="M 110 520 L 50 580" fill="none" stroke="#95d5b2" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.4"/>
  <path d="M 110 520 L 200 590" fill="none" stroke="#95d5b2" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.4"/>
  <path d="M 1090 330 L 1160 280" fill="none" stroke="#95d5b2" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.4"/>

  <text x="92" y="120" font-family="Georgia, serif" font-size="34" letter-spacing="6" fill="#e09f3e" font-weight="bold">ONE REGION. ONE FUTURE.</text>

  <text x="88" y="218" font-family="Georgia, serif" font-size="88" fill="#ffffff" font-weight="bold">One City for the</text>
  <text x="88" y="316" font-family="Georgia, serif" font-size="88" fill="#ffffff" font-weight="bold">Big Sandy</text>

  <text x="92" y="380" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#d8f3dc">The honest case for uniting the Pikeville–Prestonsburg corridor</text>

  <text x="110" y="575" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#d8f3dc" text-anchor="middle">Pikeville</text>
  <text x="1090" y="278" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#d8f3dc" text-anchor="middle">Prestonsburg</text>
</svg>
